
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BMI Calculator</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navigation Bar -->

    <nav class="navbar">

        <div class="logo">
            BMI Calculator
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="profile.html">Profile</a>

            <a href="about.html">About</a>

            <a href="login.html">Logout</a>

        </div>

    </nav>


    <!-- Main Content -->

    <main class="main-container">

        <section class="bmi-box">

            <h1>BMI Calculator</h1>

            <p class="description">
                Calculate your Body Mass Index
            </p>


            <div class="input-group">

                <label for="height">
                    Height (cm)
                </label>

                <input
                    type="number"
                    id="height"
                    placeholder="Enter height"
                    min="1">

            </div>


            <div class="input-group">

                <label for="weight">
                    Weight (kg)
                </label>

                <input
                    type="number"
                    id="weight"
                    placeholder="Enter weight"
                    min="1">

            </div>


            <div class="buttons">

                <button onclick="calculateBMI()">
                    Calculate BMI
                </button>

                <button
                    class="reset-btn"
                    onclick="resetBMI()">
                    Reset
                </button>

            </div>


            <div id="result">

                <h2>Your BMI</h2>

                <p id="bmiValue">--</p>

                <p id="bmiStatus"></p>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
