
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <title>Login</title>

    <link rel="stylesheet" href="./login.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary" id="navbar">

    <div class="container-fluid">

        <nav class="navbar bg-body-tertiary">

            <div class="container">

                <a class="navbar-brand" href="#">
                    <img src="./hospital_logo.png"
                         alt="Bootstrap"
                         width="30"
                         height="24">
                </a>

            </div>

        </nav>

        <ul class="nav nav-pills nav-fill gap-2 p-1 small bg-primary rounded-5 shadow-sm"
            id="pillNav2"
            role="tablist"
            style="--bs-nav-link-color: var(--bs-white);
                   --bs-nav-pills-link-active-color: var(--bs-primary);
                   --bs-nav-pills-link-active-bg: var(--bs-white);">

            <li class="nav-item" role="presentation">

                <a class="anchor" href="./index.html">

                    <button class="nav-link rounded-5"
                            id="home-tab2"
                            type="button"
                            role="tab"
                            aria-selected="false">

                        Home

                    </button>

                </a>

            </li>

            <li class="nav-item" role="presentation">

                <a class="anchor"
                   href="./signup.html"
                   target="_self">

                    <button class="nav-link active rounded-5"
                            id="profile"
                            type="button"
                            role="tab"
                            aria-selected="true">

                        Profile

                    </button>

                </a>

            </li>

            <li class="nav-item" role="presentation">

                <a class="anchor" href="./about.html">

                    <button class="nav-link rounded-5"
                            id="contact-tab2"
                            type="button"
                            role="tab"
                            aria-selected="false">

                        About

                    </button>

                </a>

            </li>

        </ul>

        <form class="d-flex ms-auto" role="search">

            <input class="form-control me-2"
                   type="search"
                   placeholder="Search"
                   aria-label="Search">

            <button class="btn btn-outline-success"
                    type="submit">

                Search

            </button>

        </form>

    </div>

</nav>


<div class="container1">

    <div class="login-box">

        <h1>Welcome Back</h1>

        <p>Login to your account</p>

        <form id="loginForm">

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input type="text"
                       id="username"
                       name="username"
                       placeholder="Enter your username"
                       required>

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter your password"
                       required>

            </div>


            <button type="submit">
                Login
            </button>

        </form>


        <p id="message"></p>


        <p class="signup-text">

            Don't have an account?

            <a href="./signup.html">
                Sign Up
            </a>

        </p>

    </div>

</div>


<script src="./login.js"></script>

</body>

</html>
